<button onclick="changeText()">Change Text</button>
<button onclick="changeHTML()">Change HTML</button>
<button onclick="changeAttribute()">Add Tooltip</button>
<button onclick="removeAttribute1()">Remove Tooltip</button>
<button onclick="changeInput()">Change Input Value</button>
<button onclick="changeImage()">Change Image</button>

<script>

// ===============================
// MOST COMMON CONTENT CHANGES
// ===============================

let element = document.getElementById("demo");

// Change text
function changeText() {
    element.textContent = "New Text";
}

// Change HTML
function changeHTML() {
    element.innerHTML = "<b>Bold Text</b>";
}

// Change attribute
function changeAttribute() {
    element.setAttribute("title", "Tooltip");
    element.style.backgroundColor = "orange";
}

// Remove attribute
function removeAttribute1() {
    if (element.hasAttribute("title")) {
        element.removeAttribute("title");
        element.style.backgroundColor = "lightblue";
        element.textContent = "Tooltip Removed";
    }
}

// Change input value
function changeInput() {
    let input = document.querySelector("input");
    input.value = "Hello";
}

// Image src change

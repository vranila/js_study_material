<!DOCTYPE html>
<html>
<head>
    <title>Async Await Demo</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        .box {
            width: 400px;
            margin: 15px auto;
            padding: 15px;
            border-radius: 8px;
            background-color: lightblue;
            min-height: 40px;
            font-size: 18px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>Async / Await Demonstration</h2>

<div class="box" id="output">Click a button</div>

<button onclick="runAsyncFunction()">Async Function</button>
<button onclick="runAwaitExample()">Await Example</button>
<button onclick="runErrorHandling()">Error Handling</button>

<script>

// ===============================
// async FUNCTION
// ===============================

async function getData() {
    return "Hello from Async Function";
}

function runAsyncFunction() {
    let box = document.getElementById("output");
    box.textContent = "Loading...";
    box.style.backgroundColor = "orange";

    getData().then(result => {
        box.textContent = result;
        box.style.backgroundColor = "lightgreen";
    });
}


// ===============================
// await KEYWORD
// ===============================

function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function runAwaitExample() {
    let box = document.getElementById("output");

    box.textContent = "Start";
    box.style.backgroundColor = "orange";

    await delay(2000); // wait 2 seconds

    box.textContent = "After 2 Seconds Delay";
    box.style.backgroundColor = "lightgreen";
}


// ===============================
// ERROR HANDLING
// ===============================

async function runErrorHandling() {
    let box = document.getElementById("output");

    box.textContent = "Testing error...";
    box.style.backgroundColor = "orange";

    try {
        await Promise.reject("Error occurred");
    } catch (err) {
        box.textContent = "Caught: " + err;
        box.style.backgroundColor = "lightcoral";
    }
}

</script>

</body>
</html>
